<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project Sentinel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f5f6f8; color: #1f2329; padding: 24px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #8a919e; font-size: 13px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background: #fff; border-radius: 10px; padding: 16px;
          box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card h2 { font-size: 15px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #f0f1f3; }
  th { color: #8a919e; font-weight: 500; }
  .ok { color: #1a9c6b; } .bad { color: #d43d33; font-weight: 600; }
  .firing { color: #d43d33; font-weight: 600; } .resolved { color: #1a9c6b; }
  .full { grid-column: 1 / -1; }
  .tag { display: inline-block; background: #eef1f6; border-radius: 4px;
         padding: 1px 6px; font-size: 12px; margin-right: 4px; }
  #refresh { float: right; font-size: 12px; color: #4a6cf7; cursor: pointer; }
</style>
</head>
<body>
<h1>🛰️ Project Sentinel</h1>
<div class="sub">低资源智能项目监控系统 · <span id="plugins"></span></div>

<div class="grid">
  <div class="card">
    <h2>Agent 状态 <span id="refresh">刷新</span></h2>
    <table>
      <thead><tr><th>Agent</th><th>配置版本</th><th>最近心跳</th><th>状态</th></tr></thead>
      <tbody id="agents"></tbody>
    </table>
  </div>
  <div class="card">
    <h2>告警事件</h2>
    <table>
      <thead><tr><th>时间</th><th>来源</th><th>任务</th><th>规则</th><th>状态</th></tr></thead>
      <tbody id="alerts"></tbody>
    </table>
  </div>
  <div class="card full">
    <h2>最新指标</h2>
    <table>
      <thead><tr><th>时间</th><th>来源</th><th>任务</th><th>指标</th><th>值</th><th>说明</th></tr></thead>
      <tbody id="metrics"></tbody>
    </table>
  </div>
</div>

<script>
const fmt = s => new Date(s).toLocaleString('zh-CN', {hour12:false});
const esc = v => String(v ?? '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

async function load() {
  const [agents, metrics, alerts, plugins] = await Promise.all([
    fetch('/api/agents').then(r => r.json()),
    fetch('/api/metrics?limit=50').then(r => r.json()),
    fetch('/api/alerts?limit=20').then(r => r.json()),
    fetch('/api/plugins').then(r => r.json()),
  ]);
  document.getElementById('plugins').innerHTML =
    '已注册插件：' + plugins.map(p => `<span class="tag">${esc(p)}</span>`).join('');

  const now = Date.now();
  document.getElementById('agents').innerHTML = (agents.length ? agents : []).map(a => {
    const alive = now - new Date(a.last_seen).getTime() < 120000;
    return `<tr><td>${esc(a.agent_id)}</td><td>${esc(a.version)}</td>
      <td>${fmt(a.last_seen)}</td>
      <td class="${alive ? 'ok' : 'bad'}">${alive ? '在线' : '离线'}</td></tr>`;
  }).join('') || '<tr><td colspan="4">暂无 Agent 连接</td></tr>';

  document.getElementById('metrics').innerHTML = metrics.map(m =>
    `<tr><td>${fmt(m.ts)}</td><td>${esc(m.source)}</td><td>${esc(m.task_id)}</td>
     <td>${esc(m.name)}</td>
     <td class="${m.up ? 'ok' : 'bad'}">${m.value.toFixed(2)}</td>
     <td>${esc(m.message)}</td></tr>`).join('') || '<tr><td colspan="6">暂无数据</td></tr>';

  document.getElementById('alerts').innerHTML = alerts.map(a =>
    `<tr><td>${fmt(a.created_at)}</td><td>${esc(a.source)}</td>
     <td>${esc(a.task_id)}</td><td>${esc(a.rule)}</td>
     <td class="${a.status}">${a.status === 'firing' ? '告警中' : '已恢复'}</td></tr>`).join('')
     || '<tr><td colspan="5">暂无告警</td></tr>';
}
document.getElementById('refresh').onclick = load;
load();
setInterval(load, 15000);
</script>
</body>
</html>
